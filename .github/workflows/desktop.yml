# Windows-specific sources and release jobs are kept in private local research.
name: Desktop (Linux)

# Windows_Linux only. main is the macOS product and build.yml is its gate; a
# change there reaches this port when it is merged into Windows_Linux, and that
# push runs this. A pull_request run reads the workflow from its base branch's
# merge, so the filter below keeps PRs into main off the Windows runners too.
on:
  push:
    branches: [Windows_Linux]
  pull_request:
    branches: [Windows_Linux]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tauri's Linux build dependencies (WebKitGTK 4.1 and friends).
  TAURI_APT: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
    libxdo-dev libssl-dev patchelf file build-essential

jobs:
  engine-linux:
    name: Engine + host (Linux, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and Mesa's CPU Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build glslang-tools \
            libvulkan1 mesa-vulkan-drivers vulkan-tools python3

      - name: Vulkan device
        run: vulkaninfo --summary

      # LibRaw 0.22.2 + Vulkan-Headers, pinned and checksum-verified by the script.
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: engine-deps-${{ runner.os }}-${{ hashFiles('engine/setup-deps.sh', 'engine/setup-libraw.sh') }}

      - name: Build, CTest, host smoke
        run: engine/build-linux.sh --test

      # Artifacts drop the executable bit; carry the staged host as a tarball.
      - name: Pack the staged host
        run: tar -C build -czf host-linux-x64.tgz host-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: host-linux-x64
          path: host-linux-x64.tgz
          retention-days: 14

  desktop-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Tauri build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # the list is meant to split into words
          sudo apt-get install -y --no-install-recommends $TAURI_APT

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # the dev mock host uses Node's type stripping (>= 22.18)
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run check

      # tauri::generate_context! embeds ../dist, so it must exist for cargo.
      - name: Web build
        run: npm run build:web

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Playwright (layout harness, in-page mock host)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  package-linux:
    name: Package (Linux .deb + AppImage)
    needs: [engine-linux, desktop-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tauri build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # the list is meant to split into words
          sudo apt-get install -y --no-install-recommends $TAURI_APT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: host-linux-x64

      - name: Unpack the staged host
        run: mkdir -p build && tar -C build -xzf host-linux-x64.tgz

      - name: npm ci
        working-directory: desktop
        run: npm ci

      # linuxdeploy is itself an AppImage; hosted runners have no FUSE 2.
      - name: Build the packages
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/package.mjs linux

      - uses: actions/upload-artifact@v4
        with:
          name: framematter-linux-x64
          path: |
            desktop/release/linux/*.deb
            desktop/release/linux/*.AppImage
          if-no-files-found: error
          retention-days: 14
